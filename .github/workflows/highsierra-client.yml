name: High Sierra client

# Checks on the pushed commit also show on any pull request for it, so there
# is no separate pull_request trigger.
on:
  push:
    paths:
      - 'highsierra-client/**'
      - '.github/workflows/highsierra-client.yml'
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highsierra-client
    steps:
      - uses: actions/checkout@v5

      # Go 1.20 is the last release whose binaries run on macOS 10.13.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.20.14'
          cache-dependency-path: highsierra-client/go.sum

      - name: Vet and test
        run: make test

      - name: Build the service
        run: make build

      - uses: actions/upload-artifact@v6
        with:
          name: awg-hs-binary
          path: highsierra-client/build/awg-hs

  amneziawg-go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highsierra-client/third_party/amneziawg-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.20.14'
          cache-dependency-path: highsierra-client/third_party/amneziawg-go/go.sum
      - name: Test the Go 1.20 backport
        run: go test ./device/ ./ratelimiter/ ./replay/ ./tai64n/

  # The menu bar app needs Apple's SDK, so it is built here, and the release
  # archive and installer are put together here too.
  package:
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: highsierra-client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: awg-hs-binary
          path: highsierra-client/build

      # Xcode 16 still builds for macOS 10.13.
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build the menu bar app
        run: make app

      - name: Build the release archive and installer
        run: |
          chmod 755 build/awg-hs
          make dist pkg

      - uses: actions/upload-artifact@v6
        with:
          name: awg-hs-macos-x86_64
          path: highsierra-client/dist/*.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: awg-hs-pkg
          path: highsierra-client/dist/*.pkg
