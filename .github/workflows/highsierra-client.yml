name: High Sierra client

on:
  push:
    paths:
      - 'highsierra-client/**'
      - '.github/workflows/highsierra-client.yml'
  pull_request:
    paths:
      - 'highsierra-client/**'
      - '.github/workflows/highsierra-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highsierra-client
    steps:
      - uses: actions/checkout@v4

      # Go 1.20 is the last release whose binaries run on macOS 10.13.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: highsierra-client/go.sum

      - name: Vet and test
        run: make test

      - name: Build the release archive
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: awg-hs-macos-x86_64
          path: highsierra-client/dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: awg-hs-binary
          path: highsierra-client/build/awg-hs

  amneziawg-go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highsierra-client/third_party/amneziawg-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: highsierra-client/third_party/amneziawg-go/go.sum
      - name: Test the Go 1.20 backport
        run: go test ./device/ ./ratelimiter/ ./replay/ ./tai64n/

  package:
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: highsierra-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: awg-hs-binary
          path: highsierra-client/build

      - name: Build the installer package
        run: packaging/build-pkg.sh "$(cat VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: awg-hs-pkg
          path: highsierra-client/dist/*.pkg
